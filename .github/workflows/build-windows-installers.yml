name: Build Windows x64 EXE & MSI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows-installers.yml'
      - 'packaging/windows/**'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract app jars from official image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work patched input
          docker pull --platform linux/amd64 docker.stirlingpdf.com/stirlingtools/stirling-pdf:2.11.0
          CID="$(docker create --platform linux/amd64 docker.stirlingpdf.com/stirlingtools/stirling-pdf:2.11.0)"
          docker cp "$CID:/app/app.jar" work/app.jar
          docker cp "$CID:/app/lib" work/lib
          docker rm "$CID"

      - name: Apply PanPDF branding patches
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_patches.py work/app.jar patched/app.jar
          python scripts/apply_patches.py work/lib/common-2.11.0-plain.jar patched/common-2.11.0-plain.jar
          python scripts/apply_patches.py work/lib/proprietary-2.11.0-plain.jar patched/proprietary-2.11.0-plain.jar
          cp patched/app.jar input/app.jar
          cp work/lib/*.jar input/
          cp patched/common-2.11.0-plain.jar input/common-2.11.0-plain.jar
          cp patched/proprietary-2.11.0-plain.jar input/proprietary-2.11.0-plain.jar
          cp -r customFiles/static input/customFiles/static
          mkdir -p input/configs
          cp config/settings.yml input/configs/settings.yml

      - name: Build jpackage app image
        shell: bash
        run: |
          jpackage --type app-image \
            --name PanPDF \
            --app-version 2.11.0 \
            --vendor ActiveInAI \
            --input input \
            --main-jar app.jar \
            --main-class stirling.software.SPDF.SPDFApplication \
            --dest build \
            --win-console \
            --java-options "-Dstirling.base-path=%APPDIR%/app" \
            --java-options "-Dserver.port=8083" \
            --java-options "-Dfile.encoding=UTF-8" \
            --java-options "-Dspring.threads.virtual.enabled=true"

      - name: Install WiX and Inno Setup
        shell: powershell
        run: |
          choco install wixtoolset innosetup -y --no-progress
          $env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User')

      - name: Build MSI and EXE installers
        shell: powershell
        run: |
          jpackage --type msi --app-image build\PanPDF --dest dist --name PanPDF --app-version 2.11.0 --vendor ActiveInAI --win-menu --win-shortcut --license-file LICENSE
          jpackage --type exe --app-image build\PanPDF --dest dist --name PanPDF --app-version 2.11.0 --vendor ActiveInAI --win-menu --win-shortcut --license-file LICENSE
          Get-ChildItem dist | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: panpdf-windows-x64-installers
          path: |
            dist/*.msi
            dist/*.exe
